; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Decodes the addresses in a panic backtrace into file:line.
monitor_filters = esp32_exception_decoder
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra
; The ESP32 platform injects -Wno-unused-parameter into every build - that is
; what hid drawSimpleRobotFace() silently ignoring its `emotion` argument.
; Re-enable it for project sources only; the framework's own warnings are not
; ours to fix.
build_src_flags =
	-Wunused-parameter
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.12.1
	; Pinned to a tag: tracking the default branch made builds non-reproducible.
	https://github.com/adafruit/Adafruit_SSD1305.git#2.2.3
	bblanchon/ArduinoJson @ ^7.4.2
