[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; The default 1.3MB app slot is 95% full once NimBLE is linked in. huge_app
; gives 3MB by dropping the second OTA slot, which costs nothing here because
; updates already go over the cable.
board_build.partitions = huge_app.csv
monitor_speed = 115200
; Decodes the addresses in a panic backtrace into file:line.
monitor_filters = esp32_exception_decoder
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wall
	-Wextra
build_src_flags =
	-Wunused-parameter
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.12.1
	https://github.com/adafruit/Adafruit_SSD1305.git#2.2.3
	bblanchon/ArduinoJson @ ^7.4.2
	h2zero/NimBLE-Arduino @ ^2.1.2
